name: 24/7 Telegram Study Bot

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 5 hours
    - cron: '0 */5 * * *'
  workflow_dispatch:

# Ensures only one instance runs at a time
concurrency:
  group: bot-process
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push DB back to repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot and Auto-Commit DB
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        # Run the bot for 290 minutes (4 hours 50 mins) then exit gracefully
        timeout 290m python main.py || true
        
        # Configure Git
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add DB and commit if changed
        git add bot_database.db
        if git diff --staged --quiet; then
          echo "No database changes to commit."
        else
          git commit -m "Auto-update SQLite database cache [skip ci]"
          git push
        fi
